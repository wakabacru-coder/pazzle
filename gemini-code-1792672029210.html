<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Quest2 WebXR Ultimate Image Viewer</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        #overlay {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(0,0,0,0.85); padding: 20px; border-radius: 12px;
            max-width: 320px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h2 { margin-top: 0; font-size: 18px; }
        p { font-size: 13px; color: #cbd5e1; }
        input[type="file"] { margin: 10px 0 15px; color: #fff; width: 100%; }
        button { 
            width: 100%; padding: 12px; font-size: 16px; cursor: pointer; 
            background: #2563eb; color: white; border: none; border-radius: 6px; 
            font-weight: bold; transition: background 0.2s;
        }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div id="overlay">
        <h2>WebXR Image Viewer (Complete)</h2>
        <p>画像をアップロードして「Enter VR」を押してください。<br>VR内ではトリガーで画像を掴んで移動・スケールできます。</p>
        <input type="file" id="image-loader" accept="image/*"><br>
        <button id="vr-button">Enter VR</button>
    </div>

    <!-- Three.js とアドオンのインポート -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

        let camera, scene, renderer;
        let mesh;
        let textureLoader;
        
        // コントローラー・インタラクション用変数
        let controllers = [];
        let controllerGrips = [];
        let raycaster, intersectGroup;
        let selectedObject = null;
        let previousControllerPos = new THREE.Vector3();
        let isGrabbing = false;

        init();

        function init() {
            // シーンの初期化
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            // カメラの初期化
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 50);
            camera.position.set(0, 1.6, 0);

            // レンダラーの初期化
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            document.body.appendChild(VRButton.createButton(renderer));

            // ライティング
            scene.add(new THREE.AmbientLight(0xffffff, 1.2));

            // 画像を表示するオブジェクトのグループ（拡大縮小・移動用）
            intersectGroup = new THREE.Group();
            intersectGroup.position.set(0, 1.6, -2.0); // 目の前2mに配置
            scene.add(intersectGroup);

            // 初期プレーン（プレースホルダー）
            const geometry = new THREE.PlaneGeometry(1.6, 0.9);
            const material = new THREE.MeshBasicMaterial({ color: 0x334155, side: THREE.DoubleSide });
            mesh = new THREE.Mesh(geometry, material);
            intersectGroup.add(mesh);

            // テクスチャローダー
            textureLoader = new THREE.TextureLoader();

            // ローカルファイル選択の処理
            const fileInput = document.getElementById('image-loader');
            fileInput.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    textureLoader.load(e.target.result, (texture) => {
                        texture.colorSpace = THREE.SRGBColorSpace;
                        
                        // アスペクト比の自動計算
                        const image = texture.image;
                        const aspect = image.width / image.height;
                        let width = 1.6;
                        let height = width / aspect;
                        if (height > 1.2) {
                            height = 1.2;
                            width = height * aspect;
                        }

                        // メッシュの再構築
                        mesh.geometry.dispose();
                        mesh.geometry = new THREE.PlaneGeometry(width, height);
                        mesh.material.map = texture;
                        mesh.material.color.set(0xffffff);
                        mesh.material.needsUpdate = true;
                    });
                };
                reader.readAsDataURL(file);
            });

            // --- WebXR コントローラーの設定 ---
            raycaster = new THREE.Raycaster();
            const controllerModelFactory = new XRControllerModelFactory();

            for (let i = 0; i < 2; i++) {
                const controller = renderer.xr.getController(i);
                controller.addEventListener('selectstart', onSelectStart);
                controller.addEventListener('selectend', onSelectEnd);
                scene.add(controller);
                controllers.push(controller);

                const controllerGrip = renderer.xr.getControllerGrip(i);
                controllerGrip.add(controllerModelFactory.createControllerModel(controllerGrip));
                scene.add(controllerGrip);
                controllerGrips.push(controllerGrip);
            }

            window.addEventListener('resize', onWindowResize);
            renderer.setAnimationLoop(animate);
        }

        // コントローラーのトリガーを押したとき
        function onSelectStart(event) {
            const controller = event.target;
            
            // レイキャストで画像を指しているか判定
            const tempMatrix = new THREE.Matrix4();
            tempMatrix.identity().extractRotation(controller.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

            const intersects = raycaster.intersectObject(mesh);
            if (intersects.length > 0) {
                selectedObject = intersectGroup; // グループごと掴む
                isGrabbing = true;
                controller.attach(selectedObject); // コントローラーの子要素にして追従させる
            }
        }

        // コントローラーのトリガーを離したとき
        function onSelectEnd(event) {
            if (isGrabbing && selectedObject) {
                isGrabbing = false;
                // シーンのルートへオブジェクトを戻す
                scene.attach(selectedObject);
                selectedObject = null;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
