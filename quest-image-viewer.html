<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quest 画像ビューワー</title>
<style>
:root{--bg:#f3f4f7;--panel:rgba(255,255,255,.94);--text:#15181d;--sub:#5b6573;--accent:#2f6df6;--border:#d5d9e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--panel:rgba(22,27,34,.94);--text:#e6edf3;--sub:#9aa7b4;--accent:#4d8dff;--border:#30363d}}
:root[data-theme="dark"]{--bg:#0d1117;--panel:rgba(22,27,34,.94);--text:#e6edf3;--sub:#9aa7b4;--accent:#4d8dff;--border:#30363d}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#panel{position:fixed;top:max(16px,env(safe-area-inset-top,0px));left:16px;z-index:2;width:min(400px,calc(100% - 32px));max-height:calc(100% - 32px);overflow-y:auto;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
#panel.hidden{display:none}
h1{font-size:18px;margin:0 0 4px}
p{margin:6px 0;font-size:13px;line-height:1.6;color:var(--sub)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
button,label.btn{font:inherit;font-size:14px;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=file]{display:none}
#count{font-weight:600;color:var(--text)}
ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;line-height:1.7;color:var(--sub)}
b{color:var(--text)}
.xronly{display:none}
body.xr .xronly{display:flex}
body.xr .nonxr{display:none}
</style>
</head>
<body>
<div id="panel">
  <h1>Quest 画像ビューワー</h1>
  <p class="nonxr">画像・動画を選んでから没入モードに入ると、周囲の空間に並べて閲覧・操作できます。</p>
  <p class="xronly">没入中でもここから画像・動画を追加できます。</p>
  <div class="row">
    <label class="btn primary" for="file">画像・動画を選択…</label>
    <input id="file" type="file" accept="image/*,video/*" multiple>
    <label class="btn" for="bgfile">背景を選択…</label>
    <input id="bgfile" type="file" accept="image/*,video/*">
  </div>
  <div class="row nonxr">
    <button id="vr" disabled>VRで表示</button>
    <button id="ar" disabled>パススルーで表示</button>
  </div>
  <p>読み込み済み: <span id="count">0</span> 枚 <span id="status"></span></p>
  <div class="row"><button id="relayout">並べ直す</button><button id="clear">すべて削除</button></div>
  <div class="row xronly"><button id="closeov">この画面を閉じる（Bボタンのメニューから再表示）</button></div>
  <div class="nonxr">
    <p><b>コントローラー操作（没入中）</b></p>
    <ul>
      <li><b>トリガー長押し</b>：掴んで移動・変形</li>
      <li><b>A / X ボタン</b>：プリセットパネルの表示／閉じる</li>
      <li><b>グリップトリガー（中指）</b>：全画像一括アニメーションの再生／停止</li>
      <li><b>B / Y ボタン</b>：メインメニュー開閉</li>
    </ul>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $ = id => document.getElementById(id);
const PI = Math.PI, BGC = 0x0d1117;
const FONT = '"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif';
const scene = new THREE.Scene(); scene.background = new THREE.Color(BGC);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.05, 80);
camera.position.set(0,1.6,0); camera.rotation.order = 'YXZ';
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.prepend(renderer.domElement);
const grid = new THREE.GridHelper(12,24,0x30363d,0x1c2128); scene.add(grid);

// ---- ピンクフィルターシェーダー ----
const VS = 'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}';
const FS = `
uniform sampler2D map;
uniform float filterIntensity;
varying vec2 vUv;
void main(){
  vec4 texColor = texture2D(map, vUv);
  vec3 color = texColor.rgb;
  float lum = dot(color, vec3(0.299, 0.587, 0.114));
  vec3 pinkShade = vec3(
    pow(color.r, 0.82) * 1.25 + 0.08 * filterIntensity,
    pow(color.g, 1.12) * 0.78,
    pow(color.b, 0.95) * 1.10 + 0.12 * filterIntensity
  );
  vec3 highlightPink = mix(pinkShade, vec3(1.0, 0.35, 0.68), (1.0 - lum) * 0.4);
  vec3 shadowMagenta = mix(highlightPink, vec3(0.4, 0.05, 0.25), pow(1.0 - lum, 2.0) * 0.5);
  vec3 blended = mix(color, clamp(shadowMagenta, 0.0, 1.0), filterIntensity);
  gl_FragColor = vec4(blended, texColor.a);
}`;

// ---- 背景シェーダー（UVスケール/オフセットでSBSの左右を切り出す） ----
const BG_FS = 'uniform sampler2D map;uniform vec2 uvScale;uniform vec2 uvOffset;varying vec2 vUv;void main(){gl_FragColor=texture2D(map,vUv*uvScale+uvOffset);}';

// ---- パネル（キャンバスUI） ----
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.closePath();}
function makePanel(wm,hm,controls){
  const S=600, W=Math.round(wm*S), H=Math.round(hm*S);
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d'), tex=new THREE.CanvasTexture(cv);
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(wm,hm), new THREE.MeshBasicMaterial({map:tex,transparent:true}));
  const group=new THREE.Group(); group.add(mesh);
  const p={group,mesh,controls,W,H,wm,hm,owner:null,dirty:true,draw(){
    if(!p.dirty) return;
    ctx.clearRect(0,0,W,H); ctx.fillStyle='rgba(22,27,34,.96)'; rr(ctx,0,0,W,H,24); ctx.fill();
    ctx.textBaseline='middle';
    for(const c of p.controls){ // ★修正: 差し替えられた controls を必ず参照する
      const lab=typeof c.label==='function'?c.label():(c.label||'');
      if(c.t==='btn'){
        ctx.fillStyle=c.on&&c.on()?'#2f6df6':'#2a313c'; rr(ctx,c.x,c.y,c.w,c.h,12); ctx.fill();
        ctx.fillStyle='#fff'; ctx.font='24px '+FONT; ctx.textAlign='center'; ctx.fillText(lab,c.x+c.w/2,c.y+c.h/2);
      }else if(c.t==='txt'){
        ctx.fillStyle='#9aa7b4'; ctx.font=(c.size||24)+'px '+FONT; ctx.textAlign='left'; ctx.fillText(lab,c.x,c.y+c.h/2);
      }else{
        const v=Math.min(1,Math.max(0,c.get()||0)), ty=lab?c.y+c.h-16:c.y+c.h/2;
        if(lab){ctx.fillStyle='#9aa7b4';ctx.font='22px '+FONT;ctx.textAlign='left';ctx.fillText(lab,c.x,c.y+14);}
        ctx.fillStyle='#3a4350'; rr(ctx,c.x,ty-5,c.w,10,5); ctx.fill();
        ctx.fillStyle='#4d8dff'; rr(ctx,c.x,ty-5,Math.max(10,c.w*v),10,5); ctx.fill();
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(c.x+c.w*v,ty,14,0,2*PI); ctx.fill();
      }
    }
    tex.needsUpdate=true; p.dirty=false;
  }};
  mesh.userData.panel=p; return p;
}
function ctlAt(p,uv){
  const x=uv.x*p.W, y=(1-uv.y)*p.H;
  return p.controls.find(c=>c.t!=='txt'&&x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h);
}
function applySlider(p,c,uv){
  let v=Math.min(1,Math.max(0,(uv.x*p.W-c.x)/c.w));
  if(c.snap&&Math.abs(v-.5)<.03) v=.5;
  c.set(v); p.dirty=true;
}

// カメラ位置・向き（頭の姿勢）取得
const v1 = new THREE.Vector3(), v2 = new THREE.Vector3(), v3 = new THREE.Vector3();
function getCameraPositionAndDirection(posOut, dirOut){
  let m=camera.matrixWorld;
  if(renderer.xr.isPresenting){
    const xc=renderer.xr.getCamera(camera);
    m=(xc.cameras&&xc.cameras.length)?xc.cameras[0].matrix:xc.matrix;
  }
  posOut.setFromMatrixPosition(m);
  dirOut.set(-m.elements[8],0,-m.elements[10]);
  if(dirOut.lengthSq()<1e-4) dirOut.set(0,0,-1);
  dirOut.normalize();
}

// ---- ヘリ・カドハンドル ----
const MAT_HANDLE_DEFAULT = new THREE.MeshBasicMaterial({color:0x778899,transparent:true,opacity:.55,side:THREE.DoubleSide});
const MAT_HANDLE_HOVER   = new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.85,side:THREE.DoubleSide});
const MAT_HANDLE_ACTIVE  = new THREE.MeshBasicMaterial({color:0xff4d8d,transparent:true,opacity:.95,side:THREE.DoubleSide});
const OPPOSITE_CORNER = {bl:'tr',br:'tl',tr:'bl',tl:'br'};
const HM = 0.03;

function makeHandles(it){
  if(it.handlesGroup){ it.group.remove(it.handlesGroup); it.handlesGroup.traverse(o=>{if(o.geometry)o.geometry.dispose();}); }
  const hGroup=new THREE.Group(), w=it.w, h=it.h, all=[];
  const add=(geo,pos,ud)=>{const m=new THREE.Mesh(geo,MAT_HANDLE_DEFAULT);m.position.set(pos[0],pos[1],0);m.userData=Object.assign({item:it},ud);hGroup.add(m);all.push(m);};
  add(new THREE.BoxGeometry(.025,h*.4,.015),[-w/2-HM,0],{type:'heli',side:'left'});
  add(new THREE.BoxGeometry(.025,h*.4,.015),[ w/2+HM,0],{type:'heli',side:'right'});
  add(new THREE.BoxGeometry(w*.4,.025,.015),[0,-h/2-HM],{type:'heli',side:'bottom'});
  add(new THREE.BoxGeometry(w*.4,.025,.015),[0, h/2+HM],{type:'heli',side:'top'});
  [['bl',-1,-1],['br',1,-1],['tr',1,1],['tl',-1,1]].forEach(([n,sx,sy])=>
    add(new THREE.BoxGeometry(.04,.04,.015),[sx*(w/2+HM),sy*(h/2+HM)],{type:'corner',corner:n}));
  it.group.add(hGroup); it.handlesGroup=hGroup; it.allHandles=all;
}
function updateHandleVisibility(it, active=null){
  if(!it||!it.allHandles) return;
  it.allHandles.forEach(h=>{
    if(!active){h.visible=true;h.material=MAT_HANDLE_DEFAULT;}
    else if(h===active){h.visible=true;h.material=MAT_HANDLE_ACTIVE;}
    else h.visible=false;
  });
}
function getCornerLocalPos(n,w,h){
  return new THREE.Vector3((n==='tr'||n==='br'?1:-1)*(w/2+HM),(n==='tr'||n==='tl'?1:-1)*(h/2+HM),0);
}

// ---- 画像・動画アイテム ----
const items=[]; let editItem=null;

function makeItem(tex,w,h,video){
  const mat=new THREE.ShaderMaterial({uniforms:{map:{value:tex},filterIntensity:{value:0.0}},vertexShader:VS,fragmentShader:FS,side:THREE.DoubleSide});
  const group=new THREE.Group();
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);
  group.add(mesh); scene.add(group);
  const it={
    group,mesh,tex,mat,u:mat.uniforms,w,h,initialW:w,initialH:h,video:video||null,vp:null,
    animating:false,animTime:0,animDepth:2.0,animSpeed:1.0,
    orbitAnimating:false,orbitAngle:0,orbitRadius:2.5,orbitSpeed:1.0,
    basePos:new THREE.Vector3(),animDir:new THREE.Vector3(0,0,1),activeHandle:null
  };
  mesh.userData.item=it;
  makeHandles(it);
  if(video) it.vp=makeVideoPanel(it);
  items.push(it); return it;
}
// サイズ変更（ジオメトリ・ハンドル・動画パネル・編集パネルを一括更新）
function resizeItem(it,w,h){
  it.w=w; it.h=h; it.mesh.geometry.dispose(); it.mesh.geometry=new THREE.PlaneGeometry(w,h); makeHandles(it);
  if(it.vp){const s=Math.max(w,.6)/it.vp.wm; it.vp.group.scale.setScalar(s); it.vp.group.position.y=-(h/2+.02+.05*s);}
  if(editItem===it) ep.group.position.x=w/2+.04+ep.wm/2;
}

async function addImage(file){
  const bmp=await createImageBitmap(file);
  const s=Math.min(1,2048/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(bmp.width*s)); c.height=Math.max(1,Math.round(bmp.height*s));
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); if(bmp.close) bmp.close();
  const tex=new THREE.CanvasTexture(c); tex.anisotropy=4;
  makeItem(tex,.7*c.width/c.height,.7);
}
function addVideo(file){
  return new Promise((res,rej)=>{
    const v=document.createElement('video'), url=URL.createObjectURL(file);
    v.src=url; v.playsInline=true; v.preload='auto'; v.volume=.8;
    v.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('video'));};
    v.onloadedmetadata=()=>{
      const tex=new THREE.VideoTexture(v); tex.minFilter=tex.magFilter=THREE.LinearFilter;
      const it=makeItem(tex,.7*v.videoWidth/v.videoHeight,.7,v); it.url=url;
      v.onplay=v.onpause=()=>{it.vp.dirty=true;};
      v.currentTime=.01; res();
    };
  });
}
function toggle(v){ v.paused?v.play().catch(()=>{}):v.pause(); }
function makeVideoPanel(it){
  const v=it.video, wm=Math.max(it.w,.6), W=Math.round(wm*600);
  const p=makePanel(wm,.1,[
    {t:'btn',x:8,y:8,w:56,h:44,label:()=>v.paused?'▶':'❚❚',act:()=>toggle(v)},
    {t:'sld',x:76,y:8,w:W-76-170,h:44,label:'',get:()=>v.duration?v.currentTime/v.duration:0,set:x=>{if(v.duration)v.currentTime=x*v.duration;}},
    {t:'btn',x:W-150,y:8,w:44,h:44,label:()=>v.muted||v.volume===0?'×':'♪',act:()=>{v.muted=!v.muted;}},
    {t:'sld',x:W-98,y:8,w:88,h:44,label:'',get:()=>v.muted?0:v.volume,set:x=>{v.muted=false;v.volume=x;}}
  ]);
  p.group.position.set(0,-(it.h/2+.02+.05),.004); p.owner=it; it.group.add(p.group); return p;
}
function removeItem(it){
  controllers.forEach(c=>{
    const u=c.userData;
    if(u.grab===it){u.grab=null;u.grabType=null;u.handleObj=null;}
    if(u.hit&&u.hit.object.userData.item===it) u.hit=null;
  });
  if(editItem===it) exitEdit();
  if(it.video){it.video.pause();it.video.removeAttribute('src');it.video.load();URL.revokeObjectURL(it.url);}
  it.group.parent&&it.group.parent.remove(it.group);
  it.tex.dispose(); it.mesh.geometry.dispose(); it.mat.dispose();
  if(it.handlesGroup) it.handlesGroup.traverse(o=>{if(o.geometry)o.geometry.dispose();});
  if(it.vp){it.vp.mesh.geometry.dispose();it.vp.mesh.material.map.dispose();it.vp.mesh.material.dispose();}
  const i=items.indexOf(it); if(i>=0) items.splice(i,1); updateCount();
}
function layoutBase(){
  const R=2.2, gap=.14, per=5, rows=[];
  for(let i=0;i<items.length;i+=per) rows.push(items.slice(i,i+per));
  rows.forEach((row,ri)=>{
    const y=1.5-(ri-(rows.length-1)/2)*1.05;
    let a=-(row.reduce((s,it)=>s+(it.initialW+gap)/R,0)-gap/R)/2;
    row.forEach(it=>{
      it.animating=false; it.orbitAnimating=false;
      resizeItem(it,it.initialW,it.initialH);
      const th=a+it.initialW/R/2; a+=(it.initialW+gap)/R;
      scene.attach(it.group); it.group.scale.set(1,1,1);
      it.group.position.set(R*Math.sin(th),y,-R*Math.cos(th)); it.group.lookAt(0,y,0);
    });
  });
}
function layout(){
  currentPresetMode='none'; isPreset1Animating=false; isPreset2Animating=false;
  layoutBase(); buildPresetControls();
}
function updateCount(){ $('count').textContent=items.length; }

// ---- プリセット状態管理 ----
let currentPresetMode='none', isPreset1Animating=false, isPreset2Animating=false;
let globalScale=1.0, preset1DepthLimit=3.0, preset1Speed=1.0, preset1Spacing=0.8;
let preset2Scale=1.0, preset2Speed=1.0;

function updatePreset1Layout(){
  items.forEach((it,idx)=>{
    scene.attach(it.group); it.group.scale.set(1,1,1);
    const aspect=it.initialW/it.initialH;
    resizeItem(it,.7*globalScale*aspect,.7*globalScale);
    it.group.position.set(0,1.5,-1.2-idx*preset1Spacing);
    it.group.rotation.set(0,0,0);
    it.basePos.copy(it.group.position);
    it.animDepth=preset1DepthLimit; it.animSpeed=preset1Speed; it.animDir.set(0,0,1);
    it.animating=isPreset1Animating; it.animTime=0;
  });
}
function updatePreset2Layout(){
  const R=2.5, total=items.length;
  items.forEach((it,idx)=>{
    scene.attach(it.group); it.group.scale.set(1,1,1);
    const aspect=it.initialW/it.initialH;
    resizeItem(it,.7*preset2Scale*aspect,.7*preset2Scale);
    const angle=(idx/Math.max(1,total))*2*PI;
    it.orbitAngle=angle; it.orbitRadius=R; it.orbitSpeed=preset2Speed;
    it.orbitAnimating=isPreset2Animating;
    it.group.position.set(R*Math.sin(angle),1.5,-R*Math.cos(angle));
    it.group.lookAt(0,1.5,0);
    it.basePos.copy(it.group.position);
  });
}
function applyPreset(n){
  currentPresetMode=n; isPreset1Animating=false; isPreset2Animating=false;
  items.forEach(it=>{it.animating=false;it.orbitAnimating=false;});
  n==='preset1'?updatePreset1Layout():updatePreset2Layout();
  buildPresetControls();
}
function togglePresetAnimationByGrip(){
  if(currentPresetMode==='preset1'){
    isPreset1Animating=!isPreset1Animating;
    items.forEach(it=>{
      it.animating=isPreset1Animating;
      if(isPreset1Animating){it.basePos.copy(it.group.position);it.animTime=0;}
      else it.group.position.copy(it.basePos);
    });
  }else if(currentPresetMode==='preset2'){
    isPreset2Animating=!isPreset2Animating;
    items.forEach(it=>{it.orbitAnimating=isPreset2Animating;});
  }
}

// ---- 編集パネル ----
const ep=makePanel(.85,.68,[
  {t:'sld',x:20,y:20,w:440,h:65,label:'ピンクフィルター',snap:true,get:()=>editItem?editItem.u.filterIntensity.value:0,set:v=>{if(editItem)editItem.u.filterIntensity.value=v;}},
  {t:'sld',x:20,y:110,w:440,h:60,label:()=>'アニメ奥行き: '+(editItem?editItem.animDepth.toFixed(1)+'m':''),get:()=>editItem?editItem.animDepth/10:0.2,set:v=>{if(editItem)editItem.animDepth=v*10;}},
  {t:'btn',x:20,y:195,w:440,h:55,label:'フィルターリセット',act:()=>{
    if(!editItem)return;
    editItem.u.filterIntensity.value=0;
    if(editItem.animating){editItem.animating=false;editItem.group.position.copy(editItem.basePos);}
    editItem.animDepth=2.0;
  }},
  {t:'btn',x:20,y:270,w:440,h:50,label:'画像を削除',act:()=>{const it=editItem;exitEdit();removeItem(it);}}
]);
function enterEdit(it){
  exitEdit(); editItem=it; ep.owner=it; it.group.add(ep.group);
  ep.group.position.set(it.w/2+.04+ep.wm/2,0,.01); ep.dirty=true;
}
function exitEdit(){ if(editItem) editItem.group.remove(ep.group); editItem=null; }

// ---- プリセットパネル ----
const presetMenu=makePanel(.9,.75,[]);
presetMenu.group.visible=false; scene.add(presetMenu.group);

function buildPresetControls(){
  const c=[
    {t:'txt',x:20,y:10,w:500,h:35,label:'プリセット選択 & パラメータ調整',size:24},
    {t:'btn',x:20,y:55,w:240,h:55,label:'1. 手前〜奥整列',on:()=>currentPresetMode==='preset1',act:()=>applyPreset('preset1')},
    {t:'btn',x:270,y:55,w:240,h:55,label:'2. サラウンド円形',on:()=>currentPresetMode==='preset2',act:()=>applyPreset('preset2')}
  ];
  if(currentPresetMode==='preset1'){
    c.push(
      {t:'sld',x:20,y:125,w:490,h:55,label:()=>'全画像サイズ: '+globalScale.toFixed(2)+'x',get:()=>(globalScale-0.2)/2.8,set:v=>{globalScale=0.2+v*2.8;updatePreset1Layout();}},
      {t:'sld',x:20,y:190,w:490,h:55,label:()=>'手前アニメ移動限度: '+preset1DepthLimit.toFixed(1)+'m',get:()=>preset1DepthLimit/10,set:v=>{preset1DepthLimit=Math.max(0.1,v*10);updatePreset1Layout();}},
      {t:'sld',x:20,y:255,w:490,h:55,label:()=>'アニメ速度: '+preset1Speed.toFixed(1)+'x',get:()=>(preset1Speed-0.5)/9.5,set:v=>{preset1Speed=0.5+v*9.5;updatePreset1Layout();}},
      {t:'sld',x:20,y:320,w:490,h:55,label:()=>'奥への画像間隔: '+preset1Spacing.toFixed(2)+'m',get:()=>(preset1Spacing-0.1)/2.9,set:v=>{preset1Spacing=0.1+v*2.9;updatePreset1Layout();}}
    );
  }else if(currentPresetMode==='preset2'){
    c.push(
      {t:'sld',x:20,y:140,w:490,h:65,label:()=>'全画像サイズ: '+preset2Scale.toFixed(2)+'x',get:()=>(preset2Scale-0.2)/2.8,set:v=>{preset2Scale=0.2+v*2.8;updatePreset2Layout();}},
      {t:'sld',x:20,y:230,w:490,h:65,label:()=>'旋回速度: '+preset2Speed.toFixed(1)+'x',get:()=>(preset2Speed-0.5)/9.5,set:v=>{preset2Speed=0.5+v*9.5;updatePreset2Layout();}}
    );
  }else{
    c.push({t:'txt',x:20,y:140,w:500,h:35,label:'上のボタンでレイアウトを選んでください',size:22});
  }
  presetMenu.controls=c; presetMenu.dirty=true;
}
buildPresetControls();

function placeInFront(panel,dy,side){
  getCameraPositionAndDirection(v1,v2);
  const g=panel.group;
  scene.attach(g); g.scale.set(1,1,1);
  g.position.copy(v1).addScaledVector(v2,1.2).addScaledVector(v3.set(-v2.z,0,v2.x),side*.5);
  g.position.y=v1.y+dy;
  g.lookAt(v1.x,g.position.y,v1.z);
  panel.dirty=true;
}
function togglePresetPanel(){
  presetMenu.group.visible=!presetMenu.group.visible;
  if(presetMenu.group.visible) placeInFront(presetMenu,0,1);
}

// ---- 背景（360° / 180° SBS ステレオ） ----
let bgMode='none', bgTex=null, bgVideo=null, bgUrl=null, bgName='';
const mkBgMat=(sx,ox)=>new THREE.ShaderMaterial({
  uniforms:{map:{value:null},uvScale:{value:new THREE.Vector2(sx,1)},uvOffset:{value:new THREE.Vector2(ox,0)}},
  vertexShader:VS,fragmentShader:BG_FS,side:THREE.DoubleSide,depthWrite:false});
const bgMat=mkBgMat(1,0), bgMatL=mkBgMat(.5,0), bgMatR=mkBgMat(.5,.5);
const mkBgMesh=(m,layer)=>{const o=new THREE.Mesh(new THREE.BufferGeometry(),m);o.position.y=1.6;o.renderOrder=-1;o.frustumCulled=false;o.visible=false;o.layers.set(layer);scene.add(o);return o;};
const bgMesh=mkBgMesh(bgMat,0), bgL=mkBgMesh(bgMatL,1), bgR=mkBgMesh(bgMatR,2); // layer1=左目 / layer2=右目

function setBgMode(m){
  bgMode=m; const is180=m==='180';
  const g=is180?new THREE.SphereGeometry(30,64,32,-PI/2,PI):new THREE.SphereGeometry(30,64,32);
  g.scale(-1,1,1);
  [bgMesh,bgL,bgR].forEach(o=>{o.geometry.dispose();o.geometry=g;});
  bgMat.uniforms.uvScale.value.x=is180?.5:1; // 非没入時は左目側のみ表示
  applyMode(); menu.dirty=true;
}
async function loadBg(file){
  let tex,vid=null,url=null;
  if(file.type.startsWith('video')){
    url=URL.createObjectURL(file); vid=document.createElement('video'); vid.src=url; vid.loop=true; vid.playsInline=true;
    tex=new THREE.VideoTexture(vid); tex.minFilter=tex.magFilter=THREE.LinearFilter;
    vid.play().catch(()=>{vid.muted=true;vid.play().catch(()=>{});});
  }else{
    const bmp=await createImageBitmap(file), s=Math.min(1,4096/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas'); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); if(bmp.close) bmp.close();
    tex=new THREE.CanvasTexture(c);
  }
  if(bgTex) bgTex.dispose(); if(bgVideo) bgVideo.pause(); if(bgUrl) URL.revokeObjectURL(bgUrl);
  bgTex=tex; bgVideo=vid; bgUrl=url; bgName=file.name;
  [bgMat,bgMatL,bgMatR].forEach(m=>{m.uniforms.map.value=tex;});
  setBgMode(bgMode==='none'?'360':bgMode);
}

// ---- XRセッション ----
let session=null, mode='vr', pending=null, arOK=false, resume=null;
function applyMode(){
  const ar=mode==='ar'&&!!session;
  scene.background=ar?null:new THREE.Color(BGC); renderer.setClearAlpha(ar?0:1);
  grid.visible=!ar;
  const show=!ar&&bgMode!=='none'&&!!bgTex, stereo=show&&bgMode==='180'&&!!session;
  bgMesh.visible=show&&!stereo; bgL.visible=bgR.visible=stereo;
  document.body.classList.toggle('xr',!!session);
  menu.dirty=true;
}
async function startXR(m){
  const type=m==='ar'?'immersive-ar':'immersive-vr';
  let s;
  try{
    s=await navigator.xr.requestSession(type,{optionalFeatures:['local-floor','bounded-floor','dom-overlay'],domOverlay:{root:$('panel')}});
  }catch(e){
    s=await navigator.xr.requestSession(type,{optionalFeatures:['local-floor']});
  }
  s.addEventListener('end',()=>{
    session=null; menu.group.visible=false; presetMenu.group.visible=false; exitEdit();
    $('panel').classList.remove('hidden'); applyMode();
    const p=pending; pending=null;
    if(p) startXR(p).catch(()=>{$('status').textContent='ボタンを押して '+(p==='ar'?'パススルー':'VR')+' に切り替えてください';});
  });
  session=s; mode=m;
  await renderer.xr.setSession(s);
  $('panel').classList.remove('hidden'); applyMode();
}
function endXR(){ pending=null; resume=null; session&&session.end(); }

// ---- メインメニュー ----
const bgBtn=(x,m,l)=>({t:'btn',x,y:262,w:160,h:64,label:l,on:()=>bgMode===m,act:()=>setBgMode(m)});
const menu=makePanel(.9,.8,[
  {t:'txt',x:20,y:12,w:300,h:40,label:'メニュー',size:30},
  {t:'btn',x:20,y:70,w:245,h:64,label:'没入モード解除',act:()=>endXR()},
  {t:'btn',x:275,y:70,w:245,h:64,label:'画像・動画選択',act:()=>{
    if(!session) return;
    if(session.domOverlayState){ $('panel').classList.toggle('hidden'); } // 没入中は2Dオーバーレイを表示/非表示
    else{ resume=mode; $('status').textContent='画像・動画を選択してください（選択後に自動で没入へ戻ります）'; session.end(); }
  }},
  {t:'btn',x:20,y:150,w:500,h:64,label:()=>'パススルー：'+(mode==='ar'?'ON':'OFF'),on:()=>mode==='ar',act:()=>{
    if(!arOK&&mode!=='ar') return;
    pending=mode==='ar'?'vr':'ar'; session&&session.end();}},
  {t:'txt',x:20,y:226,w:400,h:30,label:'背景',size:24},
  bgBtn(20,'none','なし'),bgBtn(190,'360','360°'),bgBtn(360,'180','180°(SBS)'),
  {t:'btn',x:20,y:346,w:500,h:64,label:'背景ファイル選択',act:()=>{
    if(session&&session.domOverlayState) $('panel').classList.remove('hidden'); else $('bgfile').click();}},
  {t:'txt',x:20,y:420,w:500,h:40,label:()=>'背景: '+(bgName||'未選択')+(mode==='ar'?'（パススルー中は非表示）':''),size:22}
]);
menu.group.visible=false; scene.add(menu.group);
function toggleMenu(){
  menu.group.visible=!menu.group.visible;
  if(menu.group.visible) placeInFront(menu,-.1,-1);
}

// ---- コントローラー制御 ----
const controllers=[], ray=new THREE.Raycaster(), tm=new THREE.Matrix4(), wp=new THREE.Vector3();
const _pl=new THREE.Plane(), _n=new THREE.Vector3(), _q=new THREE.Quaternion(), _gp=new THREE.Vector3();
let lastClick={item:null,t:0};
const lineGeo=new THREE.CylinderGeometry(.004,.004,1,6); lineGeo.rotateX(PI/2); lineGeo.translate(0,0,-.5);

function setRay(c){
  tm.identity().extractRotation(c.matrixWorld);
  ray.ray.origin.setFromMatrixPosition(c.matrixWorld);
  ray.ray.direction.set(0,0,-1).applyMatrix4(tm);
}
function castFrom(c,objs){ setRay(c); return ray.intersectObjects(objs,false)[0]||null; }
// 画像の面を通る平面とコントローラーレイの交点
function rayPlanePoint(c,g,out){
  setRay(c);
  _n.set(0,0,1).applyQuaternion(g.getWorldQuaternion(_q));
  _pl.setFromNormalAndCoplanarPoint(_n,g.getWorldPosition(_gp));
  return ray.ray.intersectPlane(_pl,out);
}
const dz=v=>Math.abs(v)<.15?0:v;

for(let i=0;i<2;i++){
  const c=renderer.xr.getController(i);
  const line=new THREE.Mesh(lineGeo,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.35,depthWrite:false}));
  line.scale.z=5; c.add(line);
  c.userData={hit:null,grab:null,grabType:null,handleObj:null,drag:null,line,src:null,prev:[],t0:0,
    p0:new THREE.Vector3(),grabRayIntersection:new THREE.Vector3(),
    initialW:.7,initialH:.7,initialRayDist:1,oppositeWorldPos:new THREE.Vector3(),clickItem:null};

  c.addEventListener('connected',e=>{c.userData.src=e.data;});
  c.addEventListener('disconnected',()=>{c.userData.src=null;c.userData.prev=[];});

  c.addEventListener('selectstart',()=>{
    const u=c.userData, h=u.hit; if(!h) return;
    const p=h.object.userData.panel, it=h.object.userData.item, handleType=h.object.userData.type;

    if(p){
      const ct=ctlAt(p,h.uv);
      if(ct&&ct.t==='btn'){ct.act();p.dirty=true;return;}
      if(ct&&ct.t==='sld'){u.drag={p,ctl:ct};applySlider(p,ct,h.uv);return;}
      const target=p.owner||{group:p.group};
      if(controllers.some(o=>o!==c&&o.userData.grab===target)) return;
      u.grab=target; u.grabType='panel'; u.clickItem=null; c.attach(target.group);
      return;
    }
    if(handleType){
      if(it.activeHandle) return;
      u.grab=it; u.grabType=handleType; u.handleObj=h.object; it.activeHandle=h.object;
      u.grabRayIntersection.copy(h.point);
      updateHandleVisibility(it,h.object);
      if(handleType==='corner'){
        u.initialW=it.w; u.initialH=it.h;
        it.group.updateMatrixWorld(true);
        u.oppositeWorldPos.copy(getCornerLocalPos(OPPOSITE_CORNER[h.object.userData.corner],it.w,it.h)).applyMatrix4(it.group.matrixWorld);
        const p0=new THREE.Vector3();
        u.initialRayDist=Math.max(.01,(rayPlanePoint(c,it.group,p0)?p0:h.point).distanceTo(u.oppositeWorldPos));
      }
      return;
    }
    if(it){
      if(controllers.some(o=>o.userData.grab===it)) return;
      u.grab=it; u.grabType='item'; u.clickItem=it; u.t0=performance.now();
      c.getWorldPosition(u.p0); c.attach(it.group);
    }
  });

  c.addEventListener('selectend',()=>{
    const u=c.userData;
    if(u.drag){u.drag=null;return;}
    if(!u.grab) return;
    const g=u.grab;
    if(g.allHandles){g.activeHandle=null;updateHandleVisibility(g,null);}
    scene.attach(g.group);
    u.grab=null; u.grabType=null; u.handleObj=null;
    if(u.clickItem&&performance.now()-u.t0<350&&c.getWorldPosition(wp).distanceTo(u.p0)<.05) onClick(g);
    u.clickItem=null;
  });
  scene.add(c); controllers.push(c);
}

function onClick(it){
  const now=performance.now(), dbl=lastClick.item===it&&now-lastClick.t<450;
  if(it.video){toggle(it.video);it.vp.dirty=true;}
  if(dbl){
    lastClick={item:null,t:0};
    if(it.video) toggle(it.video);
    if(editItem===it) exitEdit(); else enterEdit(it);
  }else lastClick={item:it,t:now};
}

function update(dt){
  const picks=[];
  items.forEach(i=>{
    picks.push(i.mesh);
    if(i.allHandles) i.allHandles.forEach(h=>{if(h.visible)picks.push(h);});
    if(i.vp) picks.push(i.vp.mesh);
  });
  if(menu.group.visible) picks.push(menu.mesh);
  if(presetMenu.group.visible) picks.push(presetMenu.mesh);
  if(editItem) picks.push(ep.mesh);

  controllers.forEach(c=>{
    const u=c.userData, gp=u.src&&u.src.gamepad;

    if(u.drag){
      const h=castFrom(c,[u.drag.p.mesh]); if(h) applySlider(u.drag.p,u.drag.ctl,h.uv);
      u.line.scale.z=h?h.distance:3;
    }else if(u.grab){
      u.line.scale.z=.3;
      const it=u.grab, g=it.group;
      const sx=gp?dz(gp.axes[2]||0):0, sy=gp?dz(gp.axes[3]||0):0;

      if(u.grabType==='item'){
        g.position.z=Math.min(-.2,g.position.z+sy*dt*2);
        g.scale.setScalar(Math.min(3,Math.max(.2,g.scale.x*(1+sx*dt))));
      }else if(u.grabType==='corner'){
        const cur=new THREE.Vector3();
        if(rayPlanePoint(c,g,cur)){
          if(Math.abs(sx)>.01) u.initialRayDist=Math.max(.01,u.initialRayDist/(1+sx*dt));
          let sf=Math.max(.01,cur.distanceTo(u.oppositeWorldPos))/u.initialRayDist;
          sf=Math.max(sf,.15/Math.min(u.initialW,u.initialH));
          const name=u.handleObj.userData.corner;
          resizeItem(it,u.initialW*sf,u.initialH*sf);
          u.handleObj=it.allHandles.find(h=>h.userData.corner===name); it.activeHandle=u.handleObj;
          updateHandleVisibility(it,u.handleObj);
          const signX=(name==='tr'||name==='br')?1:-1, signY=(name==='tr'||name==='tl')?1:-1;
          const off=new THREE.Vector3(-signX*(it.w/2+HM),-signY*(it.h/2+HM),0).multiplyScalar(g.scale.x).applyQuaternion(g.quaternion);
          g.position.copy(u.oppositeWorldPos).sub(off);
        }
      }else if(u.grabType==='heli'){
        const side=u.handleObj.userData.side;
        const h=castFrom(c,[it.mesh]);
        const cur=h?h.point.clone():u.grabRayIntersection.clone();
        const d=cur.clone().sub(u.grabRayIntersection);
        u.grabRayIntersection.copy(cur);
        d.clampScalar(-.08,.08);
        const dr=(d.x+d.y)*1.5;
        if(Math.abs(dr)>1e-5){
          if(side==='top'||side==='bottom') g.rotation.x+=dr; else g.rotation.y+=dr;
        }
      }
    }else{
      const h=castFrom(c,picks); u.hit=h; u.line.scale.z=h?h.distance:5;
    }

    if(gp){
      const dn=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);

      const dn1=dn(1); // グリップ
      if(dn1&&!u.prev[1]){
        if(currentPresetMode!=='none') togglePresetAnimationByGrip();
        else if(u.hit){
          const it=u.hit.object.userData.item;
          if(it){
            it.animating=!it.animating;
            if(it.animating){
              it.basePos.copy(it.group.position);
              getCameraPositionAndDirection(v1,v2);
              const yaw=Math.atan2(v2.x,v2.z), sy=Math.round(yaw/(PI/2))*(PI/2);
              it.animDir.set(Math.sin(sy),0,Math.cos(sy)).normalize().negate();
              it.animTime=0;
            }else it.group.position.copy(it.basePos);
          }
        }
      }
      u.prev[1]=dn1;

      const dn3=dn(3); // スティック押し込み：90°スナップ
      if(dn3&&!u.prev[3]&&u.hit){
        const it=u.hit.object.userData.item;
        if(it){const r=it.group.rotation;
          r.x=Math.round(r.x/(PI/2))*(PI/2); r.y=Math.round(r.y/(PI/2))*(PI/2); r.z=Math.round(r.z/(PI/2))*(PI/2);}
      }
      u.prev[3]=dn3;

      const dn4=dn(4); // A / X
      if(dn4&&!u.prev[4]&&renderer.xr.isPresenting) togglePresetPanel();
      u.prev[4]=dn4;

      const dn5=dn(5); // B / Y
      if(dn5&&!u.prev[5]&&renderer.xr.isPresenting) toggleMenu();
      u.prev[5]=dn5;
    }
  });

  // ハンドルのホバー表示（2本のコントローラーで競合しないよう一括処理）
  const hov=new Set();
  controllers.forEach(c=>{const u=c.userData; if(u.hit&&!u.grab&&!u.drag) hov.add(u.hit.object);});
  items.forEach(it=>{
    if(it.allHandles&&!it.activeHandle) it.allHandles.forEach(h=>{h.material=hov.has(h)?MAT_HANDLE_HOVER:MAT_HANDLE_DEFAULT;});
  });

  // アニメーション（掴んでいる間は停止）
  items.forEach(i=>{
    const free=i.group.parent===scene;
    if(i.animating&&free){
      i.animTime+=dt*(i.animSpeed||1);
      const d=(Math.sin(i.animTime*2-PI/2)+1)*.5*i.animDepth;
      i.group.position.copy(i.basePos).addScaledVector(i.animDir,d);
    }else if(i.orbitAnimating&&free){
      i.orbitAngle+=dt*.5*(i.orbitSpeed||1);
      const R=i.orbitRadius||2.5;
      i.group.position.set(R*Math.sin(i.orbitAngle),1.5,-R*Math.cos(i.orbitAngle));
      i.group.lookAt(0,1.5,0);
    }
    if(i.vp){
      if(i.video&&!i.video.paused&&((i.vpT=(i.vpT||0)+dt)>.2)){i.vpT=0;i.vp.dirty=true;} // シークバー更新
      if(i.vp.dirty) i.vp.draw();
    }
  });

  if(menu.group.visible&&menu.dirty) menu.draw();
  if(presetMenu.group.visible&&presetMenu.dirty) presetMenu.draw();
  if(editItem&&ep.dirty) ep.draw();
}

const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{update(Math.min(clock.getDelta(),.1));renderer.render(scene,camera);});

// ---- 2Dビュー・UI ----
let drag=false,lx=0,ly=0;
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{
  if(!drag||renderer.xr.isPresenting) return;
  camera.rotation.y+=(e.clientX-lx)*.004;
  camera.rotation.x=Math.max(-1.2,Math.min(1.2,camera.rotation.x+(e.clientY-ly)*.004));
  lx=e.clientX; ly=e.clientY;
});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

async function handleFiles(files){
  if(!files.length) return;
  $('status').textContent='読み込み中…'; let fail=0;
  for(const f of files){
    try{ f.type.startsWith('video')?await addVideo(f):await addImage(f); }catch(err){fail++;console.warn(err);}
  }
  if(currentPresetMode==='preset1') updatePreset1Layout();
  else if(currentPresetMode==='preset2') updatePreset2Layout();
  else layout();
  updateCount();
  $('status').textContent=fail?fail+' 件は読み込めませんでした':'';
  if(resume){const m=resume;resume=null;startXR(m).catch(()=>{$('status').textContent='「VRで表示」または「パススルーで表示」を押して戻ってください';});}
}

$('file').addEventListener('change',async e=>{ await handleFiles([...e.target.files]); e.target.value=''; });
$('bgfile').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{await loadBg(f);$('status').textContent='背景を設定しました';}catch(err){$('status').textContent='背景を読み込めませんでした';}
  e.target.value='';
  if(resume){const m=resume;resume=null;startXR(m).catch(()=>{});}
});
$('relayout').onclick=()=>layout();
$('clear').onclick=()=>{[...items].forEach(removeItem);};
$('closeov').onclick=()=>$('panel').classList.add('hidden');
// 2Dオーバーレイ操作が背後の3D空間の選択として扱われないようにする
$('panel').addEventListener('beforexrselect',e=>e.preventDefault());

if(navigator.xr){
  navigator.xr.isSessionSupported('immersive-vr').then(ok=>{$('vr').disabled=!ok;if(!ok)$('status').textContent='このブラウザはVR非対応です';}).catch(()=>{});
  navigator.xr.isSessionSupported('immersive-ar').then(ok=>{arOK=ok;$('ar').disabled=!ok;}).catch(()=>{});
}else $('status').textContent='WebXR非対応です（Quest ブラウザで開いてください）';

const go=m=>()=>{resume=null;startXR(m).catch(err=>{$('status').textContent='没入モードを開始できませんでした';console.warn(err);});};
$('vr').onclick=go('vr'); $('ar').onclick=go('ar');
})();
